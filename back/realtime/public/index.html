<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>WebSocket + SSE</title>
  <style>
    body { font-family: system-ui; max-width: 40rem; margin: 2rem auto; }
    #log { white-space: pre-wrap; background: #111; color: #eee; padding: 1rem; min-height: 8rem; }
  </style>
</head>
<body>
  <h1>WebSocket + SSE</h1>
  <p>同じメッセージを WS でブロードキャストし、SSE でも受けます。</p>
  <input id="msg" value="hello" />
  <button id="send">send</button>
  <div id="log"></div>
  <script>
    const log = document.querySelector("#log");
    const ws = new WebSocket(`ws://${location.host}/ws`);
    const sse = new EventSource("/sse");
    const line = (prefix, data) => { log.textContent += prefix + data + "\n"; };
    ws.onmessage = (e) => line("ws: ", e.data);
    sse.onmessage = (e) => line("sse: ", e.data);
    document.querySelector("#send").onclick = () => {
      ws.send(document.querySelector("#msg").value);
    };
  </script>
</body>
</html>
