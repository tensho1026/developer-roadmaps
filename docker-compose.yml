services:
  postgres:
    image: postgres:16-alpine
    container_name: roadmaps-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: roadmaps
      POSTGRES_PASSWORD: roadmaps
      POSTGRES_DB: roadmaps
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadmaps -d roadmaps"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: roadmaps-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  mysql:
    image: mysql:8.4
    container_name: roadmaps-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: roadmaps
      MYSQL_DATABASE: roadmaps
      MYSQL_USER: roadmaps
      MYSQL_PASSWORD: roadmaps
    volumes:
      - mysql_data:/var/lib/mysql

  mongodb:
    image: mongo:7
    container_name: roadmaps-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: roadmaps
      MONGO_INITDB_ROOT_PASSWORD: roadmaps
      MONGO_INITDB_DATABASE: roadmaps
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: roadmaps-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: roadmaps
      RABBITMQ_DEFAULT_PASS: roadmaps

  nginx:
    image: nginx:1.27-alpine
    container_name: roadmaps-nginx
    ports:
      - "8088:80"
    volumes:
      - ./back/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  elasticsearch:
    image: elasticsearch:8.15.5
    container_name: roadmaps-elasticsearch
    profiles: ["search"]
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - es_data:/usr/share/elasticsearch/data

volumes:
  postgres_data:
  redis_data:
  mysql_data:
  mongo_data:
  es_data:
